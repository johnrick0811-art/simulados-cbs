<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor - CBS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 font-sans p-6">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg">
        <header class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-xl font-bold text-blue-600">🛠️ Painel de Controle - Simulados CBS</h1>
                <p class="text-xs text-gray-500">Gerencie planilhas e configure os simulados para relatórios.</p>
            </div>
            <a href="documentos.html" class="bg-emerald-100 text-emerald-800 px-4 py-2 rounded-lg font-bold text-xs hover:bg-emerald-200 transition">📄 Ir para Gerador de Documentos</a>
        </header>

        <!-- Configurações do Simulado e Título -->
        <div class="mb-6 bg-blue-50 p-4 rounded-xl border border-blue-200 grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
            <div>
                <label class="block text-xs font-bold text-blue-900 mb-1">Selecionar / Criar Simulado:</label>
                <select id="select-simulado" onchange="mudarSimulado()" class="w-full px-3 py-2 border rounded-lg font-bold text-xs bg-white">
                    <option value="1">1º Simulado</option>
                    <option value="2">2º Simulado</option>
                    <option value="3" selected>3º Simulado</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-blue-900 mb-1">Nome / Título do Simulado (Exibido no Documento):</label>
                <input type="text" id="input-titulo-simulado" placeholder="Ex: III SIMULADO DE 2026 - 4º ANO A" oninput="salvarTituloSimulado()" class="w-full px-3 py-2 border rounded-lg text-xs bg-white font-semibold">
            </div>
        </div>

        <!-- Área de Upload -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="p-4 bg-gray-50 rounded-xl border relative">
                <h3 class="font-bold text-gray-800 text-xs mb-2">📄 Planilha EvalBee (Turma A)</h3>
                <input type="file" id="file-turma-a" accept=".xlsx" class="w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-blue-600 file:text-white mb-2">
                <span id="status-a" class="text-xs text-gray-400 block mb-2">Nenhum arquivo</span>
                <button onclick="excluirTurma('a')" class="bg-red-100 hover:bg-red-200 text-red-700 px-2.5 py-1 rounded text-[11px] font-bold transition">🗑️ Excluir Turma A</button>
            </div>
            <div class="p-4 bg-gray-50 rounded-xl border relative">
                <h3 class="font-bold text-gray-800 text-xs mb-2">📄 Planilha EvalBee (Turma B / C)</h3>
                <input type="file" id="file-turma-b" accept=".xlsx" class="w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-green-600 file:text-white mb-2">
                <span id="status-b" class="text-xs text-gray-400 block mb-2">Nenhum arquivo</span>
                <button onclick="excluirTurma('b')" class="bg-red-100 hover:bg-red-200 text-red-700 px-2.5 py-1 rounded text-[11px] font-bold transition">🗑️ Excluir Turma B/C</button>
            </div>
        </div>

        <!-- Botões de Ação -->
        <div class="flex flex-wrap justify-between items-center gap-3 pt-4 border-t">
            <button onclick="salvarDadosLocais()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl text-xs transition shadow-lg">
                💾 Salvar Dados e Título
            </button>
            <button onclick="excluirTudo()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-xl text-xs transition shadow-lg">
                ⚠️ Limpar Todos os Dados
            </button>
        </div>
        <p id="msg-sucesso" class="text-green-600 font-bold text-xs mt-3 text-center hidden">✅ Dados salvos com sucesso no navegador!</p>
    </div>

    <script>
        let simAtual = "3";

        function mudarSimulado() {
            simAtual = document.getElementById("select-simulado").value;
            carregarInterface();
        }

        function carregarInterface() {
            let tituloSalvo = localStorage.getItem(`titulo_sim_${simAtual}`) || "III SIMULADO DE 2026 - 4º ANO A";
            document.getElementById("input-titulo-simulado").value = tituloSalvo;

            let temA = localStorage.getItem(`dados_turma_a_sim${simAtual}`);
            let temB = localStorage.getItem(`dados_turma_b_sim${simAtual}`);

            document.getElementById("status-a").innerText = temA ? "🟢 Turma A carregada." : "Nenhum arquivo";
            document.getElementById("status-b").innerText = temB ? "🟢 Turma B/C carregada." : "Nenhum arquivo";
        }

        function salvarTituloSimulado() {
            let titulo = document.getElementById("input-titulo-simulado").value;
            localStorage.setItem(`titulo_sim_${simAtual}`, titulo);
        }

        function limparDadosEvalBee(jsonBruto) {
            return jsonBruto.map(item => {
                let nome = item["Name"] || item["NAME"] || item["nome"] || "";
                if (!nome) return null;
                
                let turma = String(item["Class"] || item["turma"] || "A").trim().toUpperCase();
                let port = Number(item["6 Ano -PORTUGUÊS"] || item["PORT"] || item["Português"] || 0);
                let ing  = Number(item["6 Ano -INGLÊS "] || item["ING"] || item["Inglês"] || 0);
                let hist = Number(item["6 Ano -HISTÓRIA"] || item["HIST"] || item["História"] || 0);
                let geo  = Number(item["6 Ano -GEOGRAFIA"] || item["GEO"] || item["Geografia"] || 0);
                let art  = Number(item["6 Ano -ARTES"] || item["ART"] || 0);
                let cien = Number(item["6 Ano -BIOLOGIA"] || item["6 Ano -CIÊNCIAS"] || item["CIÊN"] || item["Ciências"] || 0);
                let mat  = Number(item["6 Ano -MATEMÁTICA "] || item["MAT"] || item["Matemática"] || 0);
                let soma = Number(item["Total Marks"] || (port + ing + hist + geo + art + cien + mat) || 0);

                return { nome: String(nome).trim(), turma: turma.includes("C") ? "C" : "A", port, ing, hist, geo, art, cien, mat, soma };
            }).filter(x => x !== null);
        }

        document.getElementById('file-turma-a').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(evt) {
                let wb = XLSX.read(new Uint8Array(evt.target.result), {type: 'array'});
                let jsonLimpo = limparDadosEvalBee(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]));
                localStorage.setItem(`dados_turma_a_sim${simAtual}`, JSON.stringify(jsonLimpo));
                carregarInterface();
            };
            reader.readAsArrayBuffer(file);
        });

        document.getElementById('file-turma-b').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(evt) {
                let wb = XLSX.read(new Uint8Array(evt.target.result), {type: 'array'});
                let jsonLimpo = limparDadosEvalBee(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]));
                localStorage.setItem(`dados_turma_b_sim${simAtual}`, JSON.stringify(jsonLimpo));
                carregarInterface();
            };
            reader.readAsArrayBuffer(file);
        });

        function excluirTurma(turma) {
            if (confirm(`Deseja realmente excluir os dados da Turma ${turma.toUpperCase()} deste simulado?`)) {
                localStorage.removeItem(`dados_turma_${turma}_sim${simAtual}`);
                carregarInterface();
                alert(`Turma ${turma.toUpperCase()} excluída com sucesso!`);
            }
        }

        function salvarDadosLocais() {
            salvarTituloSimulado();
            let msg = document.getElementById("msg-sucesso");
            msg.classList.remove("hidden");
            setTimeout(() => msg.classList.add("hidden"), 3000);
        }

        function excluirTudo() {
            if (confirm("⚠️ Deseja limpar todos os dados salvos no navegador?")) {
                localStorage.clear();
                carregarInterface();
                alert("Todos os dados foram limpos com sucesso!");
            }
        }

        window.onload = carregarInterface;
    </script>
</body>
</html>
