<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Documentos Oficiais - CBS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bibliotecas corrigidas e atualizadas para o Word (.docx) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pizzip/3.1.4/pizzip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.39.0/docxtemplater.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none; }
            .relatorio-card { box-shadow: none; border: none; margin: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans p-4 md:p-8">

    <!-- Painel de Controles e Exportação (Oculto na Impressão) -->
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md mb-6 no-print">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-base font-bold text-blue-700">📄 Gerador de Documentos Oficiais - CBS</h1>
            <a href="index.html" class="bg-gray-200 text-gray-700 px-3 py-1 rounded text-xs font-bold hover:bg-gray-300 transition">⬅ Voltar ao Painel</a>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
            <div>
                <label class="block text-[11px] font-bold text-gray-700 mb-1">Simulado</label>
                <select id="filtro-simulado" class="w-full px-3 py-2 border rounded text-xs font-semibold bg-gray-50" onchange="carregarDocumento()">
                    <option value="3" selected>3º Simulado</option>
                    <option value="2">2º Simulado</option>
                    <option value="1">1º Simulado</option>
                </select>
            </div>
            <div>
                <label class="block text-[11px] font-bold text-gray-700 mb-1">Tipo de Relatório</label>
                <select id="tipo-relatorio" class="w-full px-3 py-2 border rounded text-xs font-semibold bg-gray-50" onchange="carregarDocumento()">
                    <option value="geral">Classificação Geral</option>
                    <option value="turma">Turma Específica</option>
                </select>
            </div>
            <div>
                <label class="block text-[11px] font-bold text-gray-700 mb-1">Turma</label>
                <select id="filtro-turma" class="w-full px-3 py-2 border rounded text-xs font-semibold bg-gray-50" onchange="carregarDocumento()">
                    <option value="A">Turma A</option>
                    <option value="C">Turma B / C</option>
                </select>
            </div>
            <div class="flex items-end">
                <button onclick="carregarDocumento()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-3 rounded text-xs transition shadow">🔍 Atualizar</button>
            </div>
        </div>

        <!-- Seção de Upload do Modelo Word e Botões -->
        <div class="flex flex-wrap justify-between items-center border-t pt-3 gap-3">
            <div class="flex items-center gap-2">
                <label class="text-[11px] font-bold text-gray-700">Seu Modelo Word (.docx):</label>
                <input type="file" id="file-template-word" accept=".docx" class="text-[11px] text-gray-500 file:py-1 file:px-2 file:rounded file:border-0 file:bg-gray-700 file:text-white">
            </div>
            <div class="flex gap-2">
                <button onclick="gerarWordComTemplate()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-3 rounded text-xs transition shadow">📥 Baixar Word Preenchido</button>
                <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded text-xs transition shadow">🖨️ Salvar PDF</button>
            </div>
        </div>
    </div>

    <!-- TELA DE PRÉ-VISUALIZAÇÃO DINÂMICA -->
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg relatorio-card border border-gray-200">
        <div class="text-center border-b-2 border-black pb-3 mb-4">
            <h2 class="text-xs font-black tracking-wider">CBS</h2>
            <h1 class="text-sm font-black tracking-wide my-0.5">COLÉGIO BATISTA DE SANTARÉM</h1>
            <p class="text-[10px] font-bold text-gray-700 uppercase tracking-widest">78 ANOS EDUCANDO GERAÇÕES E FAZENDO HISTÓRIA!</p>
        </div>

        <div id="doc-titulo" class="text-center font-bold text-xs mb-4 uppercase">
            III SIMULADO DE 2026 - 4º ANO A
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full border-collapse border border-black text-[11px]">
                <thead>
                    <tr class="bg-gray-100 text-black">
                        <th class="border border-black px-2 py-1 text-center w-12" id="th-col-1">SALA</th>
                        <th class="border border-black px-2 py-1 text-left">NOME</th>
                        <th class="border border-black px-2 py-1 text-center w-10">PORT.</th>
                        <th class="border border-black px-2 py-1 text-center w-10">ING.</th>
                        <th class="border border-black px-2 py-1 text-center w-10">HIST.</th>
                        <th class="border border-black px-2 py-1 text-center w-10">GEO.</th>
                        <th class="border border-black px-2 py-1 text-center w-10">ART.</th>
                        <th class="border border-black px-2 py-1 text-center w-10">CIÊN.</th>
                        <th class="border border-black px-2 py-1 text-center w-10">MAT.</th>
                        <th class="border border-black px-2 py-1 text-center w-12 font-bold">SOMA</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo">
                    <tr><td colspan="10" class="border border-black px-2 py-4 text-center text-gray-500">Carregando...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="text-center font-bold text-[10px] mt-6 text-gray-800 tracking-wider">
            COLÉGIO BATISTA DE SANTARÉM - SISTEMA DE AVALIAÇÃO
        </div>
    </div>

    <script>
        function carregarDocumento() {
            let sim = document.getElementById("filtro-simulado").value;
            let tipo = document.getElementById("tipo-relatorio").value;
            let turmaFiltro = document.getElementById("filtro-turma").value;
            let tituloDoc = document.getElementById("doc-titulo");
            let thCol1 = document.getElementById("th-col-1");
            const tbody = document.getElementById("tabela-corpo");

            tbody.innerHTML = `<tr><td colspan="10" class="border border-black px-2 py-4 text-center text-gray-500">Carregando dados...</td></tr>`;

            let tituloCustom = localStorage.getItem(`titulo_sim_${sim}`) || "III SIMULADO DE 2026";
            let serieCustom = localStorage.getItem(`serie_sim_${sim}`) || "4º ANO";
            
            if (tipo === 'geral') {
                tituloDoc.innerText = `${tituloCustom} - ${serieCustom} - CLASSIFICAÇÃO GERAL`;
                thCol1.innerText = `SALA`;
            } else {
                tituloDoc.innerText = `${tituloCustom} - ${serieCustom} ${turmaFiltro}`;
                thCol1.innerText = `SALA`;
            }

            let dadosAlunos = extrairAlunosDoLocalStorage(sim);

            if (dadosAlunos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="border border-black px-2 py-4 text-center text-red-500 font-bold">Nenhum dado encontrado para este simulado. Faça o upload no Painel.</td></tr>`;
                return;
            }

            if (tipo === 'geral') {
                dadosAlunos.sort((a, b) => b.soma - a.soma);
            } else {
                dadosAlunos = dadosAlunos.filter(a => a.turma === turmaFiltro);
                dadosAlunos.sort((a, b) => a.nome.localeCompare(b.nome));
            }

            tbody.innerHTML = "";
            dadosAlunos.forEach((aluno, index) => {
                let tr = document.createElement("tr");
                let col1Val = tipo === 'geral' ? (index + 1) : aluno.turma;
                
                tr.innerHTML = `
                    <td class="border border-black px-2 py-1 text-center font-semibold">${col1Val}</td>
                    <td class="border border-black px-2 py-1 font-medium">${aluno.nome}</td>
                    <td class="border border-black px-2 py-1 text-center">${aluno.port.toFixed(2).replace('.', ',')}</td>
                    <td class="border border-black px-2 py-1 text-center">${aluno.ing.toFixed(2).replace('.', ',')}</td>
                    <td class="border border-black px-2 py-1 text-center">${aluno.hist.toFixed(2).replace('.', ',')}</td>
                    <td class="border border-black px-2 py-1 text-center">${aluno.geo.toFixed(2).replace('.', ',')}</td>
                    <td class="border border-black px-2 py-1 text-center">${aluno.art.toFixed(2).replace('.', ',')}</td>
                    <td class="border border-black px-2 py-1 text-center">${aluno.cien.toFixed(2).replace('.', ',')}</td>
                    <td class="border border-black px-2 py-1 text-center">${aluno.mat.toFixed(2).replace('.', ',')}</td>
                    <td class="border border-black px-2 py-1 text-center font-bold">${aluno.soma.toFixed(2).replace('.', ',')}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function extrairAlunosDoLocalStorage(sim) {
            let d1 = JSON.parse(localStorage.getItem(`dados_turma_a_sim${sim}`) || "[]");
            let d2 = JSON.parse(localStorage.getItem(`dados_turma_b_sim${sim}`) || "[]");
            let listaUnificada = [...d1, ...d2];

            let mapa = new Map();
            listaUnificada.forEach(item => {
                let nome = item["nome"] || "";
                if (!nome) return;
                let turma = item["turma"] || "A";

                mapa.set(`${nome}_${turma}`, {
                    nome: nome,
                    turma: turma,
                    port: Number(item["port"] || 0),
                    ing: Number(item["ing"] || 0),
                    hist: Number(item["hist"] || 0),
                    geo: Number(item["geo"] || 0),
                    art: Number(item["art"] || 0),
                    cien: Number(item["cien"] || 0),
                    mat: Number(item["mat"] || 0),
                    soma: Number(item["soma"] || 0)
                });
            });
            return Array.from(mapa.values());
        }

        async function gerarWordComTemplate() {
            let fileInput = document.getElementById("file-template-word");
            if (fileInput.files.length === 0) {
                alert("Por favor, selecione o seu arquivo modelo em Word (.docx) primeiro.");
                return;
            }

            let sim = document.getElementById("filtro-simulado").value;
            let tipo = document.getElementById("tipo-relatorio").value;
            let turmaFiltro = document.getElementById("filtro-turma").value;
            
            let tituloCustom = localStorage.getItem(`titulo_sim_${sim}`) || "III SIMULADO DE 2026";
            let serieCustom = localStorage.getItem(`serie_sim_${sim}`) || "4º ANO";
            let dadosAlunos = extrairAlunosDoLocalStorage(sim);

            if (tipo === 'geral') {
                dadosAlunos.sort((a, b) => b.soma - a.soma);
            } else {
                dadosAlunos = dadosAlunos.filter(a => a.turma === turmaFiltro);
                dadosAlunos.sort((a, b) => a.nome.localeCompare(b.nome));
            }

            let alunosFormatados = dadosAlunos.map((a, idx) => ({
                posicao: tipo === 'geral' ? idx + 1 : a.turma,
                turma: a.turma,
                nome: a.nome,
                port: a.port.toFixed(2).replace('.', ','),
                ing: a.ing.toFixed(2).replace('.', ','),
                hist: a.hist.toFixed(2).replace('.', ','),
                geo: a.geo.toFixed(2).replace('.', ','),
                art: a.art.toFixed(2).replace('.', ','),
                cien: a.cien.toFixed(2).replace('.', ','),
                mat: a.mat.toFixed(2).replace('.', ','),
                soma: a.soma.toFixed(2).replace('.', ',')
            }));

            let file = fileInput.files[0];
            let reader = new FileReader();

            reader.onload = function(e) {
                try {
                    let zip = new PizZip(e.target.result);
                    let doc = new window.docxtemplater(zip, {
                        paragraphLoop: true,
                        linebreaks: true,
                    });

                    let textoTituloFinal = tipo === 'geral' 
                        ? `${tituloCustom} - ${serieCustom} - CLASSIFICAÇÃO GERAL` 
                        : `${tituloCustom} - ${serieCustom} ${turmaFiltro}`;

                    doc.render({
                        titulo_simulado: textoTituloFinal,
                        data_geracao: new Date().toLocaleDateString('pt-BR'),
                        alunos: alunosFormatados
                    });

                    let out = doc.getZip().generate({
                        type: "blob",
                        mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                    });

                    saveAs(out, `Relatorio_${tituloCustom.replace(/\s+/g, '_')}_${serieCustom}.docx`);
                } catch (error) {
                    alert("Erro ao processar o modelo Word. Verifique as tags: " + error.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        window.onload = carregarDocumento;
    </script>
</body>
</html>
